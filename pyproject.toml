[project]
name = "incident-rca-pipeline"
version = "0.2.0"
description = "Correlates Prometheus and ELK alerts into incident clusters and drafts runbook steps"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Only needed when RCA_DATABASE_URL points at Postgres (see docker-compose.yml).
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
incident-rca = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
