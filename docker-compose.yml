version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - RCA_LOG_LEVEL=INFO
      - RCA_DEFAULT_SOURCE=ingest
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rca_db
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
