services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RCA_LOG_LEVEL: INFO
      RCA_DEFAULT_SOURCE: ingest
      RCA_CORRELATION_WINDOW_SECONDS: 900
      RCA_DATABASE_URL: postgresql+psycopg://rca_user:rca_password@db:5432/rca_db
      # Offline summariser by default. No API key, no egress.
      RCA_ENABLE_LLM: "false"
      RCA_LLM_PROVIDER: offline
    depends_on:
      db:
        # The app creates its tables on import, so it must not start against a
        # database that is still initialising.
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rca_db
      POSTGRES_USER: rca_user
      POSTGRES_PASSWORD: rca_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rca_user -d rca_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
